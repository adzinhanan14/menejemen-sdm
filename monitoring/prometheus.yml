global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'hrms-monitor'

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # ── Prometheus self-monitoring ────────────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ── HRMS Backend (NestJS /metrics endpoint) ───────────────────────
  - job_name: 'hrms-backend'
    scrape_interval: 15s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:3001']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'hrms-backend'
